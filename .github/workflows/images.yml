name: Imagenes

on:
  push:
    branches: [main]
    paths:
      - src/**
      - dbt/**
      - dashboard/**
      - services/**
      - airflow/dags/**
      - scripts/**
      - docker/**
      - pyproject.toml
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [pipeline, search, airflow]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Construir y probar en amd64
        run: |
          docker build -f docker/${{ matrix.image }}.Dockerfile --build-arg VCS_REF="$GITHUB_SHA" -t check:${{ matrix.image }} .
          case "${{ matrix.image }}" in
            pipeline) docker run --rm check:pipeline gasto --help ;;
            search) docker run --rm check:search python -c "import app" ;;
            airflow) docker run --rm check:airflow airflow version ;;
          esac
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          push: true
          tags: ghcr.io/renzoal7/gasto-${{ matrix.image }}:sha-${{ github.sha }}
          provenance: true
      - name: Registrar digest inmutable
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'ghcr.io/renzoal7/gasto-%s@%s\n' "${{ matrix.image }}" "$DIGEST" | tee image.txt
          printf 'Imagen: `ghcr.io/renzoal7/gasto-%s@%s`\n' "${{ matrix.image }}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: image.txt
          retention-days: 30
