name: Imagenes

on:
  push:
    branches: [main]
    paths:
      - src/**
      - dbt/**
      - dashboard/**
      - services/**
      - airflow/dags/**
      - scripts/**
      - docker/**
      - deploy/**
      - pyproject.toml
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # La VM del clúster es ARM64: se construye solo esa arquitectura, en un runner ARM nativo.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [pipeline, search, airflow, site]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          load: true
          tags: check:${{ matrix.image }}
          # Capas reutilizadas entre ejecuciones: solo se reconstruye lo que cambio.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Probar
        run: |
          case "${{ matrix.image }}" in
            pipeline) docker run --rm check:pipeline gasto --help ;;
            search) docker run --rm check:search python -c "import app" ;;
            airflow) docker run --rm check:airflow airflow version ;;
            site)
              docker run -d --name site-check --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
                --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8088:8080 check:site
              for attempt in $(seq 1 20); do
                curl -fsS http://127.0.0.1:8088/healthz && break
                sleep 1
              done
              curl -fsS http://127.0.0.1:8088/presupuesto/ | grep -q "Peru Spend Tracker"
              curl -fsS http://127.0.0.1:8088/ | grep -q "Peru Spend Tracker"
              curl -fsS http://127.0.0.1:8088/app.js > /dev/null
              curl -fsS http://127.0.0.1:8088/console.js > /dev/null
              # Rutas de la pagina: sirven index.html; por la IP, con <base> en /presupuesto/.
              for path in obras ranking como-funciona entidad/M1-prueba; do
                curl -fsS "http://127.0.0.1:8088/$path" | grep -q '<base href="/">'
                curl -fsS "http://127.0.0.1:8088/presupuesto/$path" | grep -q '<base href="/presupuesto/">'
              done
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/no-existe)" = 404
              # Las URLs de CSS y JS llevan la version del commit.
              curl -fsS http://127.0.0.1:8088/ | grep -q "app.js?v=${GITHUB_SHA:0:12}"
              ! curl -fsS http://127.0.0.1:8088/ | grep -q "?v=dev"
              for path in og.png favicon.svg robots.txt mapa-peru.json; do
                curl -fsS -o /dev/null "http://127.0.0.1:8088/$path"
              done
              # Consola SQL: motor, extension Parquet, editor y fuentes servidos desde el propio sitio.
              for path in duckdb/duckdb.js duckdb/duckdb-browser-eh.worker.js \
                duckdb/extensions/v1.4.3/wasm_eh/parquet.duckdb_extension.wasm \
                editor/editor.js fonts/archivo-latin-wght-normal.woff2; do
                curl -fsS -o /dev/null "http://127.0.0.1:8088/vendor/$path"
              done
              curl -fsSI -H 'Accept-Encoding: gzip' http://127.0.0.1:8088/vendor/duckdb/duckdb-eh.wasm \
                | tr -d '\r' | grep -qi '^content-type: application/wasm'
              curl -fsSI http://127.0.0.1:8088/ | grep -qi "wasm-unsafe-eval"
              # HTML y JS se revalidan siempre, para no mezclar versiones tras un despliegue.
              curl -fsSI http://127.0.0.1:8088/app.js | tr -d '\r' | grep -qi '^cache-control: no-cache$'
              curl -fsSI http://127.0.0.1:8088/obras | tr -d '\r' | grep -qi '^cache-control: no-cache$'
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/presupuesto)" = 301
              docker rm -f site-check
              ;;
          esac
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          # Reusa las capas de "Construir": publica la misma imagen que se probo.
          cache-from: type=gha,scope=${{ matrix.image }}
          push: true
          tags: ghcr.io/renzoal7/gasto-${{ matrix.image }}:sha-${{ github.sha }}
          provenance: true
      - name: Registrar digest inmutable
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'ghcr.io/renzoal7/gasto-%s@%s\n' "${{ matrix.image }}" "$DIGEST" | tee image.txt
          printf 'Imagen: `ghcr.io/renzoal7/gasto-%s@%s`\n' "${{ matrix.image }}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: image.txt
          retention-days: 30

  promote:
    name: Promover en K3s-Cortex
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clonar la infraestructura
        uses: actions/checkout@v4
        with:
          repository: RenzoAL7/K3s-Cortex
          token: ${{ secrets.CORTEX_REPO_TOKEN }}
          path: cortex
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6"
      - name: Copiar los manifiestos y fijar los cuatro digests
        id: pins
        run: |
          python scripts/promote.py cortex digests
          git -C cortex diff --check
          {
            echo "images<<EOF"
            cat digests/*/image.txt | sed 's/^/- `/; s/$/`/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Renderizar sin contactar el cluster
        run: |
          kubectl kustomize cortex/apps/peru-budget-data-platform/overlays/2ocpu > /dev/null
          kubectl kustomize cortex/apps/peru-budget-data-platform/overlays/4ocpu > /dev/null
      - name: Publicar en K3s-Cortex
        # Promocion automatica: el commit va directo a main y Argo CD lo aplica al recibir
        # el webhook de GitHub. Para revertir, revierte este commit en K3s-Cortex.
        working-directory: cortex
        env:
          IMAGES: ${{ steps.pins.outputs.images }}
        run: |
          git add -A apps/peru-budget-data-platform
          if git diff --cached --quiet; then
            echo "Los digests ya estaban desplegados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'chore(peru-budget): promote %s\n\nOrigen: https://github.com/RenzoAL7/peru-spend-tracker/commit/%s\nWorkflow: https://github.com/RenzoAL7/peru-spend-tracker/actions/runs/%s\n%s\n' \
            "$GITHUB_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$IMAGES" > "$RUNNER_TEMP/mensaje.txt"
          git commit -q -F "$RUNNER_TEMP/mensaje.txt"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::No se pudo publicar en K3s-Cortex"
          exit 1
