name: Imagenes

on:
  push:
    branches: [main]
    paths:
      - src/**
      - dbt/**
      - dashboard/**
      - services/**
      - airflow/dags/**
      - scripts/**
      - docker/**
      - deploy/**
      - pyproject.toml
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [pipeline, search, airflow, site]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Construir y probar en amd64
        run: |
          docker build -f docker/${{ matrix.image }}.Dockerfile --build-arg VCS_REF="$GITHUB_SHA" -t check:${{ matrix.image }} .
          case "${{ matrix.image }}" in
            pipeline) docker run --rm check:pipeline gasto --help ;;
            search) docker run --rm check:search python -c "import app" ;;
            airflow) docker run --rm check:airflow airflow version ;;
            site)
              docker run -d --name site-check --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
                --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8088:8080 check:site
              for attempt in $(seq 1 20); do
                curl -fsS http://127.0.0.1:8088/healthz && break
                sleep 1
              done
              curl -fsS http://127.0.0.1:8088/presupuesto/ | grep -q "Peru Spend Tracker"
              curl -fsS http://127.0.0.1:8088/ | grep -q "Peru Spend Tracker"
              curl -fsS http://127.0.0.1:8088/app.js > /dev/null
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/presupuesto)" = 301
              docker rm -f site-check
              ;;
          esac
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          push: true
          tags: ghcr.io/renzoal7/gasto-${{ matrix.image }}:sha-${{ github.sha }}
          provenance: true
      - name: Registrar digest inmutable
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'ghcr.io/renzoal7/gasto-%s@%s\n' "${{ matrix.image }}" "$DIGEST" | tee image.txt
          printf 'Imagen: `ghcr.io/renzoal7/gasto-%s@%s`\n' "${{ matrix.image }}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: image.txt
          retention-days: 30

  promote:
    name: Proponer la promocion en K3s-Cortex
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clonar la infraestructura
        uses: actions/checkout@v4
        with:
          repository: RenzoAL7/K3s-Cortex
          token: ${{ secrets.CORTEX_REPO_TOKEN }}
          path: cortex
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6"
      - name: Copiar los manifiestos y fijar los cuatro digests
        id: pins
        run: |
          python scripts/promote.py cortex digests
          git -C cortex diff --check
          {
            echo "images<<EOF"
            cat digests/*/image.txt | sed 's/^/- `/; s/$/`/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Renderizar sin contactar el cluster
        run: |
          kubectl kustomize cortex/apps/peru-budget-data-platform/overlays/2ocpu > /dev/null
          kubectl kustomize cortex/apps/peru-budget-data-platform/overlays/4ocpu > /dev/null
      - name: Abrir o actualizar la PR de promocion, sin fusion automatica
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CORTEX_REPO_TOKEN }}
          path: cortex
          add-paths: apps/peru-budget-data-platform/**
          branch: automation/peru-spend-tracker-prod
          delete-branch: true
          base: main
          commit-message: "chore(peru-budget): promote ${{ github.sha }}"
          title: "chore(peru-budget): promote ${{ github.sha }}"
          body: |
            Las cuatro imagenes se construyeron y probaron en el workflow de origen.

            - Origen: https://github.com/RenzoAL7/peru-spend-tracker/commit/${{ github.sha }}
            - Workflow: https://github.com/RenzoAL7/peru-spend-tracker/actions/runs/${{ github.run_id }}
            ${{ steps.pins.outputs.images }}

            Copia `deploy/k3s` a `apps/peru-budget-data-platform` y fija los digests en ambos perfiles.
            Revisa los manifiestos y el Ingress antes de fusionar.
            Argo CD aplica el cambio despues de fusionar; este workflow no comprueba el despliegue.
            Para revertir, revierte este commit en K3s-Cortex.
