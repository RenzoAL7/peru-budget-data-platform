limit_req_zone $binary_remote_addr zone=busqueda:5m rate=3r/s;

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    server_tokens off;

    # 'wasm-unsafe-eval' permite compilar DuckDB-WASM; no habilita eval() de JavaScript.
    # connect-src 'self' impide que la consola SQL lea URLs de otros sitios.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css;

    # Resolutor DNS interno de K3s: permite iniciar aunque el buscador aun no exista.
    resolver 10.43.0.10 valid=30s;
    set $search gasto-search.gasto-publico.svc.cluster.local;

    # DuckDB-WASM y fuentes: copias .gz generadas al construir la imagen.
    location ~ ^/(?:presupuesto/)?vendor/(.+)$ {
        alias /usr/share/nginx/html/presupuesto/vendor/$1;
        gzip_static on;
        types {
            application/wasm wasm;
            text/javascript js;
            font/woff2 woff2;
            text/plain txt LICENSE;
        }
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /presupuesto {
        return 301 /presupuesto/;
    }

    location /presupuesto/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /presupuesto/data/ {
        alias /data/published/data/;
        expires 1h;
    }

    location = /presupuesto/api/estado {
        proxy_pass http://$search:8080/readyz;
        proxy_connect_timeout 3s;
    }

    location = /presupuesto/api/buscar {
        limit_req zone=busqueda burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://$search:8080/buscar$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Dominio propio: el mismo sitio en la raiz. La pagina usa rutas relativas.
    location / {
        root /usr/share/nginx/html/presupuesto;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /data/ {
        alias /data/published/data/;
        expires 1h;
    }

    location = /api/estado {
        proxy_pass http://$search:8080/readyz;
        proxy_connect_timeout 3s;
    }

    location = /api/buscar {
        limit_req zone=busqueda burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://$search:8080/buscar$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
