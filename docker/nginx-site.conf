limit_req_zone $binary_remote_addr zone=busqueda:5m rate=3r/s;

# HTML, JS y CSS se revalidan en cada visita (304 si no cambiaron). Sin esto, Cloudflare
# les pone 4 horas de cache y, tras un despliegue, el navegador mezcla HTML nuevo con JS viejo.
# Las rutas de la pagina (/obras, /entidad/...) sirven index.html y tambien se revalidan.
# Un valor vacio no agrega la cabecera; /data/ y /vendor/ tienen su propia politica.
map $uri $page_cache {
    ~(\.(html|js|css)|/)$ "no-cache";
    ~^/(presupuesto/)?(obras|ranking|como-funciona|entidad/[^/.]+)/?$ "no-cache";
    default "";
}

# meta.json dice que version de los datos esta publicada: se revalida en cada visita. Los demas
# archivos de /data/ se piden con ?v=<fecha de publicacion>, asi que pueden guardarse una hora.
map $uri $data_cache {
    ~/meta\.json$ "no-cache";
    default "public, max-age=3600";
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    server_tokens off;

    # 'wasm-unsafe-eval' permite compilar DuckDB-WASM; no habilita eval() de JavaScript.
    # connect-src limita la consola SQL a este sitio; cloudflareinsights.com es la analitica
    # sin cookies que Cloudflare agrega a la pagina.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; worker-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $page_cache always;

    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/xml;

    # Resolutor DNS interno de K3s: permite iniciar aunque el buscador aun no exista.
    resolver 10.43.0.10 valid=30s;
    set $search gasto-search.gasto-publico.svc.cluster.local;

    # DuckDB-WASM, editor SQL y fuentes: copias .gz generadas al construir la imagen.
    location ~ ^/(?:presupuesto/)?vendor/(.+)$ {
        alias /usr/share/nginx/html/presupuesto/vendor/$1;
        gzip_static on;
        types {
            application/wasm wasm;
            text/javascript js;
            font/woff2 woff2;
            text/plain txt LICENSE;
        }
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ----- Por la IP del balanceador: el sitio vive en /presupuesto/ -----
    location = /presupuesto {
        return 301 /presupuesto/;
    }

    location /presupuesto/ {
        index index.html;
        try_files $uri $uri/ =404;
        # La pagina usa <base href="/">; aqui las rutas relativas cuelgan de /presupuesto/.
        sub_filter '<base href="/">' '<base href="/presupuesto/">';
        sub_filter_once on;
    }

    # Rutas de la pagina: todas sirven index.html y el navegador elige la vista.
    location ~ ^/presupuesto/(obras|ranking|como-funciona|entidad/[A-Za-z0-9-]+)/?$ {
        try_files /presupuesto/index.html =404;
        sub_filter '<base href="/">' '<base href="/presupuesto/">';
        sub_filter_once on;
    }

    location /presupuesto/data/ {
        alias /data/published/data/;
        add_header Cache-Control $data_cache always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /presupuesto/api/estado {
        proxy_pass http://$search:8080/readyz;
        proxy_connect_timeout 3s;
    }

    location = /presupuesto/api/buscar {
        limit_req zone=busqueda burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://$search:8080/buscar$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # ----- Dominio propio: el mismo sitio en la raiz -----
    location / {
        root /usr/share/nginx/html/presupuesto;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location ~ ^/(obras|ranking|como-funciona|entidad/[A-Za-z0-9-]+)/?$ {
        root /usr/share/nginx/html/presupuesto;
        try_files /index.html =404;
    }

    location /data/ {
        alias /data/published/data/;
        add_header Cache-Control $data_cache always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/estado {
        proxy_pass http://$search:8080/readyz;
        proxy_connect_timeout 3s;
    }

    location = /api/buscar {
        limit_req zone=busqueda burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://$search:8080/buscar$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
