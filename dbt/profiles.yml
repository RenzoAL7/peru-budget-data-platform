gasto_peru:
  target: default
  outputs:
    default:
      type: duckdb
      path: "{{ env_var('DATA_DIR') }}/warehouse.duckdb"
      threads: "{{ env_var('DUCKDB_THREADS', '4') | int }}"
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '12GB') }}"
        temp_directory: "{{ env_var('DATA_DIR') }}/tmp"
        preserve_insertion_order: false
